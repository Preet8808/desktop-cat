name: 'Release & Build Executable'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Desktop Cat v__VERSION__'
          releaseBody: |
            ## Desktop Cat Release

            ### Downloads:
            - **Installer (Recommended)**: `Desktop Cat_{{version}}_x64-setup.exe`
            - **MSI Package**: `Desktop Cat_{{version}}_x64_en-US.msi`

            ### Features:
            - Interactive desktop cat companion for Windows
            - Four personalities with weighted autonomous behaviour
            - The cat roams the whole screen and follows your cursor
            - Bongo Cat mode with live keyboard and mouse input
            - Drag to reposition, with the position saved between sessions
            - Stats panel (hunger, happiness, energy, affection)
          releaseDraft: false
          prerelease: false
